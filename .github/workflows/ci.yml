name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    # The full vitest suite finished in 8m37s on a fast runner (job 12m21s, run 42245774750).
    # On a slower runner the same files averaged 8.0s instead of 3.4s and only 251 of 420
    # files had finished when the 15-minute job was cancelled (run 42248415329). Tests were
    # still passing; none was stuck. 30 minutes covers that measured rate plus lint, typecheck
    # and the production build.
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Migrations are additive and RLS is forced
        run: pnpm check:migrations
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Dependency audit
        run: pnpm audit --prod --audit-level high
        continue-on-error: true
