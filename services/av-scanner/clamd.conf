# clamd for Casevoya uploads (#263-B). Local socket only: nothing outside the container talks to it.
# The socket lives next to the databases. /run is often an empty tmpfs at start, and the
# clamav user cannot recreate /run/clamav there; /var/lib/clamav is created in the image and
# owned by clamav.
LocalSocket /var/lib/clamav/clamd.ctl
LocalSocketMode 660
DatabaseDirectory /var/lib/clamav
Foreground yes
LogTime yes
# One scan at a time, plus a little room for the health PING. The default (10) is wasted
# memory on an instance that scans a single upload.
MaxThreads 2
# Uploads are at most 100 MB (DOC-02 ceiling). Anything larger is refused before it gets here.
StreamMaxLength 105M
MaxFileSize 105M
MaxScanSize 400M
# A file too large or too deep to scan fully is reported (Heuristics.Limits.Exceeded) rather than
# passed as clean; the API treats that as an error, so the upload stays held.
AlertExceedsMax yes
# Reload new signatures without holding two databases in memory at once (scans pause briefly).
ConcurrentDatabaseReload no
SelfCheck 3600
