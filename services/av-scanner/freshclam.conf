# freshclam for Casevoya uploads (#263-B): official ClamAV signatures only.
DatabaseDirectory /var/lib/clamav
DatabaseMirror database.clamav.net
LogTime yes
# Twelve checks a day while an instance runs; clamd reloads after an update.
Checks 12
NotifyClamd /etc/clamav/clamd.conf
Foreground no
PidFile /var/lib/clamav/freshclam.pid
# Don't load a second copy of the engine to test a download. ClamAV's own Docker note:
# freshclam's database test plus clamd's loaded engine is what runs a 4 GiB instance out of
# memory (https://docs.clamav.net/manual/Installing/Docker.html, read 2026-10-29).
# standard-1 is 4 GiB for the whole container; clamd's loaded engine is about 1.7 GiB.
TestDatabases no
# A stalled mirror must not sit forever. The entrypoint no longer waits on this process,
# but a hung download would still hold memory.
ConnectTimeout 30
ReceiveTimeout 60
