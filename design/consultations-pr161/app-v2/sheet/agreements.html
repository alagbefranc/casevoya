<!--cv-head--><link rel="icon" href="../../assets/brand/favicon.ico" sizes="32x32"><link rel="icon" href="../../assets/brand/favicon.svg" type="image/svg+xml"><link rel="icon" type="image/png" sizes="16x16" href="../../assets/brand/favicon-16.png"><link rel="icon" type="image/png" sizes="32x32" href="../../assets/brand/favicon-32.png"><link rel="icon" type="image/png" sizes="48x48" href="../../assets/brand/favicon-48.png"><link rel="apple-touch-icon" href="../../assets/brand/apple-touch-icon.png"><link rel="manifest" href="../../assets/brand/site.webmanifest"><meta name="theme-color" content="#0075DE"><meta property="og:site_name" content="Casevoya"><meta property="og:image" content="https://casevoya.ca/assets/og/og-default.png"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630"><meta property="og:image:alt" content="Casevoya: immigration practice management"><!--/cv-head--></head><body>
<script src="../kit/icons-open.js"></script>
<script src="shell.js"></script><script src="../kit/data.js"></script><script src="../kit/ui.js"></script><script src="../kit/mascot.js"></script><script src="../kit/rb.js"></script><script src="../kit/sep.js"></script><script src="../kit/kit2.js"></script><script src="../kit/fp.js"></script><script src="../kit/aft.js"></script><script src="../kit/states2.js"></script>
<script>
// Agreements module (PRD §10 AGR-01..05, DESIGN §8 "Agreements and finance", PRD-GAP C15/D10). Final pass, 17 Oct 2026.
// Tabs: All agreements · Quote builder · Agreement editor · Envelope · Compare versions · Representation authority. Deep link ?tab=…
shell({crumbs:[['inbox','Records',1],['signature','Agreements']],pills:['8 records','2 waiting for signatures'],tabs:[['list','All agreements'],['quote','Quote builder'],['editor','Agreement editor'],['envelope','Envelope'],['compare','Compare versions'],['authority','Representation authority']],onTab:t=>tab(t),
 actions:`${BTN('New quote',{ic:'plus',p:1,dlg:'dlgNewQ'})}`});
const AG=[
 ['priya','Priya Sharma','NL-2026-0142','Service agreement · S-05 v2',BD('ok','Executed'),'3 of 3','4 Oct 2026','envelope'],
 ['priya','Priya Sharma','NL-2026-0142','Amendment 1 · add Olena as dependant',BD('blue','Partially signed'),'1 of 3','Expires 29 Oct','envelope'],
 ['Kofi Mensah','Kofi Mensah','NL-2026-0131','Service agreement · S-05 v2',BD('rev','Sent'),'0 of 2','Expires 28 Oct','editor'],
 ['Tomás Duarte','Tomás Duarte','Lead L6','Quote Q-0044 · PR, family class',BD('gr','Quote · not an agreement'),'—','Valid to 31 Oct','quote'],
 ['ana','Ana Ferreira','Lead L5','Consultation agreement · C-02 v3',BD('ok','Executed'),'2 of 2','12 Oct 2026','list'],
 ['sofia','Sofia Reyes','Lead L3','Service agreement · S-05 v1',BD('bad','Declined'),'0 of 2','9 Oct · history kept','list'],
 ['Hamid Rahimi','Hamid Rahimi','Lead L4','Service agreement · S-05 v1 → v2',BD('gr','Voided · fees changed'),'1 of 2','6 Oct · replaced by v2','compare'],
 ['Mei Tanaka','Mei Tanaka','Lead L9','Quote Q-0041 · work permit',BD('gr','Expired'),'—','10 Oct 2026','list']];
const T={
list:()=>PH('Agreements','Quotes, consultation agreements and service agreements for every client. An accepted quote is not a signed agreement, and a signed agreement doesn’t prove government representation authority; that’s recorded separately.')+
 KPI([['Waiting for signatures','2','Amara signed amendment 1','?tab=envelope'],['Sent, not opened','1','Kofi Mensah · 3 days','?tab=editor','warn'],['Quotes out','1','Tomás Duarte · valid to 31 Oct','?tab=quote'],['Authority missing','1','Kofi · needed before submission','?tab=authority','warn']])+
 FBAR('Search agreements, clients or matters',['All','Waiting','Executed','Quotes','Declined, voided, expired'])+
 TBL('All agreements',['Client','Matter or lead','Record','State','Signed','Date'],AG.map(a=>[`<span class="fp-row">${AV(a[0])}<b style="font-weight:500">${a[1]}</b></span>`,NUM(a[2]),`<a href="?tab=${a[7]}" style="color:var(--blue)">${a[3]}</a>`,a[4],NUM(a[5]),`<span class="num">${a[6]}</span>`]))+
 `<p class="fp-note">${I('info','s')} Declined, expired, voided and partially signed envelopes keep their full event history (AGR-04). Casevoya doesn’t judge whether an agreement is legally sufficient; your professional reviewer owns the mandatory clauses.</p>`,
quote:()=>PH('Quote Q-0044 · Tomás Duarte','Permanent residence, family class. A quote proposes a defined service; the client signs a service agreement after accepting it.','forms-mapping')+
 `<div class="fp-g2"><div>`+SEC('briefcase','Scope and services',PAD(DL([['Scope','Prepare and submit one family-class PR application for Tomás Duarte and spouse; respond to IRCC requests until decision'],['Services','Eligibility review · document checklist · forms · submission package · two rounds of client review'],['Not included','Appeals, judicial review, other applications, translations beyond 10 pages'],['Deliverables','Submission package with manifest · status updates · decision explanation'],['Fee structure','Milestones (flat per stage)'],['Expiry','<span class="num">31 Oct 2026</span> · after that the quote needs a new version']])))+
 SEC('invoice','Fees, by category',TBL('Quote lines',['Category','Description','>CAD'],[['Professional fee','Milestone 1 · engagement and eligibility review','1,600.00'],['Professional fee','Milestone 2 · package ready and released','1,600.00'],['Professional fee','Milestone 3 · decision follow-up','1,000.00'],['Tax','HST 13% on professional fees (effective-dated rate, approved by the firm)','546.00'],['Disbursement','Translations and courier, estimated','454.00'],['<b>Total to Northline</b>','','<b>5,200.00</b>']])+PAD(`<div class="alert info" style="margin:0">${I('globe')}<div><b>Government fees are separate</b>CAD 1,525.00 per adult applicant, entered by hand from the IRCC fee list on 12 Oct 2026 (Amara Osei). Paid by the client to IRCC, never through Northline. Recheck before sending.</div></div>`))+`</div><div>`+
 SEC('calendar','Instalments',TBL('Instalments',['When','>CAD','Paid as'],[['On signing','1,808.00','Advance · client account'],['Package released','1,808.00','Invoice after delivery'],['Decision recorded','1,584.00','Invoice after delivery']])+PAD(`<p class="fp-note" style="margin:0">Money paid before work is done is an advance. It sits in the client account until Northline invoices delivered work (FIN-03, FIN-07).</p>`))+
 SEC('refund','Refund policy',PAD(`<p style="font-size:14.5px">Unearned advances are refunded in full within 10 business days of a written request. Earned milestones aren’t refundable. Taken from template S-05 §9, reviewed by Amara Osei on 2 Sep 2026.</p>`))+
 `<div class="fp-row">${RUN('Send quote','Quote sent to Tomás',{sub:'He can accept it in his portal. Accepting doesn’t sign anything.',ic:'send'})}${BTN('Preview as client',{toast:'Client preview',sub:'Shows the quote exactly as Tomás will see it.'})}${BTN('Turn into agreement',{href:'?tab=editor'})}</div></div></div>`,
editor:()=>PH('Service agreement · Kofi Mensah','Generated from template S-05 v2 (approved 2 Sep 2026). Mandatory clauses are owned by your professional reviewer and can’t be edited here.')+
 `<div class="fp-g2"><div>`+SEC('file-doc','Clauses',`<div class="fp-pad">${[['1','Parties and consultant identity','Amara Osei, RCIC-IRB R712345 · Kofi Mensah',1],['2','Scope of services','Express Entry profile and PR application',0],['3','Responsibilities of each party','Client gives true, complete information on time',1],['4','Communication','Portal messages; replies within 2 business days',0],['5','Fees and disbursements','Professional fees, HST and disbursements shown separately; government fees paid by the client to IRCC',1],['6','Client account and advances','Advances held in the client account until earned',1],['7','Complaints','How to complain to Northline and to the College',1],['8','Termination','Either party, in writing; unearned advances refunded',1],['9','Signatures','Client then consultant',1]].map(([n,t,s,m])=>`<div class="li"><span class="num" style="width:22px;color:var(--t2)">${n}</span><div><b>${t}</b><small>${s}</small></div><span class="r">${m?`<span class="fp-tag">${I('lock','s')}Mandatory · reviewer owns</span>`:BTN('Edit',{toast:'Clause opened for editing',sub:'Edits create a new draft version.'})}</span></div>`).join('')}</div>`)+
 `</div><div>`+SEC('signature','Signing',PAD(DL([['Version','S-05 v2 · draft 3 · hash <span class="num">a41e…9c02</span>'],['Signers, in order','1. Kofi Mensah · 2. Amara Osei'],['Signer check','Email code, then name typed'],['E-sign consent','Asked before the document opens'],['Sent','<span class="num">14 Oct 2026, 11:20</span> · not opened yet'],['Expires','<span class="num">28 Oct 2026</span>']])+`<div class="fp-row" style="margin-top:12px">${RUN('Send a reminder','Reminder sent to Kofi',{p:0,ic:'bell'})}<button class="btn sm" data-dlg="dlgVoid">${I('x-circle','s')}Void envelope</button></div>`))+
 `<div class="alert warn">${I('info')}<div><b>Government forms sign separately</b>This envelope is for the service agreement only. IRCC forms have their own signature rules (AGR-03).</div></div></div></div>`,
envelope:()=>PH('Envelope · Amendment 1 (Priya Sharma)','Adds Olena as an accompanying dependant. Everything else in the executed agreement stays the same.')+
 `<div class="fp-g2"><div>`+SEC('users','Signers, in order',PAD(STEPS([['Amara Osei, Northline','Signed 15 Oct 2026, 10:02 ET · email code','done'],['Priya Sharma','Opened 16 Oct, 19:40 IST · waiting for signature','now'],['Rafael Sharma','After Priya','']])),BD('blue','1 of 3 signed'))+
 SEC('history','Signing events · secured by Casevoya',TBL('Envelope events',['When (ET)','Event','Event ID'],[['15 Oct 09:58','Envelope sent · document hash 9f3b…41aa',NUM('evt_7721')],['15 Oct 10:02','Amara Osei signed',NUM('evt_7729')],['16 Oct 10:10','Delivered to Priya (email accepted)',NUM('evt_7804')],['16 Oct 10:10','Same event received twice · ignored, nothing changed',NUM('evt_7804')],['16 Oct 10:40','Priya opened · e-sign consent given',NUM('evt_7811')]]))+`</div><div>`+
 SEC('shield','Integrity',PAD(DL([['Document','Amendment 1 to S-05 v2'],['Hash','<span class="num">9f3b…41aa</span> (SHA-256)'],['If fees change','The envelope is voided and a new version is sent, even after someone signs'],[I('certificate','s')+' When complete','Signed PDF and completion certificate are stored on the matter and in each signer’s portal']])))+
 `<div class="panel"><div class="fp-pad"><img src="../../assets/docs/esign-certificate-600.webp" srcset="../../assets/docs/esign-certificate-1200.webp 2x" alt="Completion certificate for the executed service agreement S-05 v2: three signers, signed 3 and 4 October 2026" style="width:100%;border-radius:8px;border:1px solid var(--line)"><small style="color:var(--t2);display:block;margin-top:8px">Executed original, S-05 v2 · can’t be edited (AGR-04)</small></div></div></div></div>`,
compare:()=>PH('Compare versions · Hamid Rahimi','S-05 v1 was voided on 6 Oct after the fee changed while one person had signed. v2 needs fresh signatures from everyone.')+
 SEC('repeat','Section 5 · Fees',`<div class="fp-pad fp-diff"><p>Professional fee for the work permit application: <del>CAD 2,600.00</del> <ins>CAD 2,900.00</ins>, plus HST.</p><p style="margin-top:8px">Paid as <del>one invoice after submission</del> <ins>two milestones: package released and decision recorded</ins>.</p><div class="fp-legend"><span><del>removed</del></span><span><ins>added</ins></span></div></div>`,`${BD('gr','v1 voided')} ${BD('rev','v2 sent')}`)+
 TBL('Version history',['Version','State','Signed','Event'],[['v1',BD('gr','Voided'),'Hamid, 5 Oct','Fee changed after one signature · envelope voided 6 Oct'],['v2',BD('rev','Sent'),'—','Sent 6 Oct · reminder 13 Oct']]),
authority:()=>PH('Representation authority','Recorded apart from the service agreement. A signed agreement doesn’t prove you can represent someone to the government (AGR-05).')+
 TBL('Representation authority',['Client','Scope','Evidence','Effective','State'],[[`<span class="fp-row">${AV('priya')}Priya Sharma</span>`,'Spousal sponsorship application, NL-2026-0142','Use of a representative form, signed · v1',NUM('2 Oct 2026'),BD('ok','On file')],[`<span class="fp-row">${AV('Kofi Mensah')}Kofi Mensah</span>`,'Express Entry PR application','—','—',BD('chg','Needed before submission')],[`<span class="fp-row">${AV('ana')}Ana Ferreira</span>`,'Visitor record','Revoked by client, 30 Sep','2 Aug – 30 Sep 2026',BD('gr','Revoked')]])+
 `<div class="fp-row" style="margin-top:12px">${BTN('Record authority',{p:1,ic:'plus',dlg:'dlgAuth'})}</div>`};
function tab(t){$('#content').innerHTML=(T[t]||T.list)();fpBind($('#content'))}
tab(Q.get('tab')||'list');
document.body.insertAdjacentHTML('beforeend',DLG('dlgVoid','Void this envelope?',`<p>Kofi Mensah won’t be able to sign v2 any more. The envelope and its events stay on record. You can send a new version afterwards.</p>`,`<button class="btn" onclick="closeDlg('dlgVoid')">Keep it</button><button class="btn p" style="background:#a12c20" data-confirm-hold aria-describedby="holdHint" onclick="closeDlg('dlgVoid');toast2('Envelope voided',{sub:'History kept. Send a new version when ready.'})">Hold to void envelope</button><small id="holdHint" class="sr">Press and hold to confirm</small>`)+
 DLG('dlgNewQ','New quote',FLD('nqC','Client or lead',SELECT('nqC',['Tomás Duarte · Lead L6','Mei Tanaka · Lead L9','Grace Okafor · Lead L7']))+FLD('nqT','Start from',SELECT('nqT',['Program template · PR family class v4','Program template · Work permit v3','Blank quote'])),`<button class="btn" onclick="closeDlg('dlgNewQ')">Cancel</button><button class="btn p" onclick="closeDlg('dlgNewQ');tab('quote');setTab('quote')">Create quote</button>`)+
 DLG('dlgAuth','Record representation authority',FLD('raC','Client',SELECT('raC',['Kofi Mensah · NL-2026-0131']))+FLD('raS','Scope',INP('raS','Express Entry PR application'))+FLD('raE','Evidence','<button class="btn sm">'+I('upload','s')+'Upload the signed form</button>','The government form or other authority evidence')+FLD('raD','Effective date',INP('raD','','DD/MM/YYYY')),`<button class="btn" onclick="closeDlg('dlgAuth')">Cancel</button><button class="btn p" onclick="closeDlg('dlgAuth');toast2('Authority recorded',{kind:'ok',sub:'Kofi’s submission checklist updates.'})">Save</button>`));

</script></body></html>
