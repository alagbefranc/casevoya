<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Consultations · Casevoya (prototype)</title>
<link rel="stylesheet" href="../kit/base.css"><link rel="stylesheet" href="../kit/pipeline.css"><link rel="stylesheet" href="../kit/mascot.css"><link rel="stylesheet" href="shell.css"><link rel="stylesheet" href="../kit/kit2.css"><link rel="stylesheet" href="../kit/fp.css"><link rel="stylesheet" href="../kit/aft.css">
<!--cv-head--><link rel="icon" href="../../assets/brand/favicon.ico" sizes="32x32"><link rel="icon" href="../../assets/brand/favicon.svg" type="image/svg+xml"><link rel="icon" type="image/png" sizes="16x16" href="../../assets/brand/favicon-16.png"><link rel="icon" type="image/png" sizes="32x32" href="../../assets/brand/favicon-32.png"><link rel="icon" type="image/png" sizes="48x48" href="../../assets/brand/favicon-48.png"><link rel="apple-touch-icon" href="../../assets/brand/apple-touch-icon.png"><link rel="manifest" href="../../assets/brand/site.webmanifest"><meta name="theme-color" content="#0075DE"><meta property="og:site_name" content="Casevoya"><meta property="og:image" content="https://casevoya.ca/assets/og/og-default.png"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630"><meta property="og:image:alt" content="Casevoya: immigration practice management"><!--/cv-head--></head><body>
<script src="shell.js"></script><script src="../kit/data.js"></script><script src="../kit/ui.js"></script><script src="../kit/mascot.js"></script><script src="../kit/rb.js"></script><script src="../kit/sep.js"></script><script src="../kit/kit2.js"></script><script src="../kit/fp.js"></script><script src="../kit/aft.js"></script><script src="../kit/states2.js"></script>
<script>
// Consultations: availability, buffer, capacity, timezone, reschedule/cancel/no-show, booking fee as an advance, consultation agreement (PRD §9 CRM-03/04, PRD-GAP C11).
shell({crumbs:[['users','Leads',1],['calendar','Consultations']],pills:['3 this week','Hosted booking page live (demo)'],tabs:[['upcoming','Upcoming'],['availability','Availability'],['booking','Booking page'],['record','Consultation record']],onTab:t=>tab(t),actions:BTN('Book for a client',{ic:'plus',p:1,dlg:'dlgBook'})});
const T={
upcoming:()=>PH('Consultations','Initial consultations booked by clients or by staff. A consultation has its own agreement, separate from any later service agreement.','calendar-link')+
 TBL('Upcoming consultations',['When (your time)','Client','With','Agreement','Booking fee','State',''],[[NUM('Thu 22 Oct 10:30 ET'),'Ana Ferreira','Amara Osei · Zoom (planned)','C-02 v3 signed',BD('ok','Held as advance'),BD('blue','Confirmed'),BTN('Reschedule',{dlg:'dlgRes'})],[NUM('Fri 23 Oct 14:00 ET'),'Wei & Lin Zhang','Daniel Ruiz · office','Sent',BD('rev','Pending'),BD('rev','Awaiting agreement'),BTN('Remind',{toast:'Reminder sent'})],[NUM('Tue 20 Oct 09:00 ET'),'Hamid Rahimi','Amara Osei · phone','C-02 v3 signed','No fee',BD('blue','Confirmed'),BTN('Cancel',{dlg:'dlgCan'})],[NUM('Thu 15 Oct 16:00 ET'),'Yusuf Demir','Amara Osei · Zoom','C-02 v3 signed',BD('ok','Earned after meeting'),BD('bad','No-show'),BTN('Follow up',{ic:'no-show',toast:'Follow-up task created'})]])+
 `<p class="fp-note">A booking fee paid before the meeting is an advance and goes to the client account. Booking can’t relabel it as earned (PRD §9).</p>`,
availability:()=>PH('Availability','Only the calendars you choose are read. Two people can’t book the same slot.')+
 `<div class="fp-g2"><div>${SEC('clock','Amara Osei',PAD(DL([['Days','Tue, Thu 09:00–17:00 ET'],['Length','45 minutes'],['Buffer','15 minutes before and after'],['Capacity','4 a day'],['Timezone','America/Toronto · clients see their own'],['Calendars read','Northline · consultations (Google Calendar, planned)'],['Video meetings',`<span style="display:inline-flex;gap:14px;align-items:center"><span style="display:inline-flex;gap:6px;align-items:center"><img src="../../assets/logos/integrations/googlemeet.svg" alt="" width="16" height="16" style="opacity:.75">Google Meet</span><span style="display:inline-flex;gap:6px;align-items:center"><img src="../../assets/logos/integrations/microsoftteams.svg" alt="" width="16" height="16" style="opacity:.75">Teams</span><span class="mu">· planned, link added to the invite</span></span>`]])))}</div><div>${SEC('calendar','This week',PAD(miniCal()))}</div></div>`,
booking:()=>PH('Booking page','The firm-branded page clients use to book. Share it as a link or embed it on your site.')+
 `<div class="fp-g2"><div class="panel"><div class="fp-pad"><img src="../../assets/firms/northline-glyph-128.png" alt="" width="28" height="28"> <b style="font-weight:500;vertical-align:8px">Northline Immigration</b><h3 style="font-size:20px;font-weight:400;margin:10px 0 4px">Book an initial consultation</h3><p class="fp-note" style="margin:0 0 12px">45 minutes with a licensed consultant. Times are in your timezone.</p><div class="fp-row">${['Tue 20 Oct 11:00','Thu 22 Oct 13:30','Thu 22 Oct 15:00'].map(t=>`<button class="fchip">${t}</button>`).join('')}</div><a class="btn p sm" style="margin-top:14px" href="../public/book.html">Open the client booking page</a></div></div><div>${SEC('link','Share',PAD(`<p class="fp-note" style="margin:0 0 8px">Link</p><div class="fp-row"><code style="font-size:13px">northline.casevoya.example/book</code><button class="btn s sm" type="button" data-toast="Link copied">${I('copy','s')}Copy link</button></div><p class="fp-note">Embed code and the enquiry form are on <a href="../public/enquiry.html" style="color:var(--blue)">the enquiry page</a>.</p>`))}</div></div>`,
record:()=>PH('Consultation record · Tomás Duarte','Notes are staff-only. The outcome summary the client sees is reviewed by the consultant first (CRM-04).')+
 `<div class="fp-g2"><div>${SEC('note','Notes (staff only)',PAD(`<p style="font-size:14.5px">Married 2019, two children. Spouse in Brazil. Wants PR, family class. Has police certificates from both countries.</p>`))}${SEC('check-circle','Outcome summary for Tomás',PAD(`<p style="font-size:14.5px">We discussed a family-class PR application. Next: Northline sends you a quote with the scope and fees.</p><div class="fp-row" style="margin-top:10px">${RUN('Approve and share','Shared with Tomás',{sub:'He sees it in his portal.'})}${BTN('Edit',{toast:'Editing the summary'})}</div>`),BD('rev','Needs consultant review'))}</div><div>${agCard()}</div></div>`};
let AG=Q.get('ag')||'signed';
function agCard(){
 const seg=`<div class="fp-row" role="group" aria-label="Demo agreement state" style="gap:6px;margin-bottom:12px">${[['signed','Signed'],['sent','Sent, not signed'],['voided','Voided']].map(([k,l])=>`<button class="fchip${AG===k?' on':''}" aria-pressed="${AG===k}" onclick="AG='${k}';tab('record')">${l}</button>`).join('')}<span class="mu" style="font-size:12px;align-self:center">demo state</span></div>`;
 const fee=['Fee','INV-0211 · CAD 300.00 · paid'], prop=['Proposal','<a href="agreements.html?tab=quote" style="color:var(--blue)">Quote Q-0044</a>'];
 if(AG==='sent') return seg+SEC('file-check','Agreement and fee',PAD(DL([['Agreement','Consultation agreement C-02 v3'],['Sent','Wed 21 Oct 15:12 ET to tomas.duarte@example.com'],['Opened','Not yet'],fee])+
  `<p class="fp-note" style="margin:10px 0">The link is private to Tomás and works until he signs or you void it. Voiding keeps it on record.</p><div class="fp-row"><button class="btn s sm" type="button" data-toast="Signing link copied">${I('copy','s')}Copy signing link</button>${BTN('Remind',{toast:'Reminder sent to Tomás'})}<button class="btn sm" style="color:#a12c20" onclick="openDlg('dlgVoid')">Void</button></div>`),BD('rev','Sent, not signed'));
 if(AG==='voided') return seg+SEC('file-check','Agreement and fee',PAD(DL([['Agreement','Consultation agreement C-02 v3 · <s>sent 21 Oct</s>'],['Voided','Fri 23 Oct 13:40 ET by Amara Osei'],['Reason','Withdrawn from the consultation record'],fee])+
  `<p class="fp-note" style="margin:10px 0">The old link now tells Tomás this agreement was withdrawn. Send a fresh one when you’re ready.</p><div class="fp-row"><button class="btn p sm" onclick="AG='sent';tab('record');toast2('Agreement sent',{kind:'ok',sub:'Tomás gets a new private link by email.'})">Send consultation agreement</button></div>`),BD('bad','Voided'));
 return seg+SEC('file-check','Agreement and fee',PAD(DL([['Agreement','Consultation agreement C-02 v3 · signed 17 Sep'],fee,prop])),BD('ok','Signed'));
}
function tab(t){$('#content').innerHTML=(T[t]||T.upcoming)();fpBind($('#content'))}
tab(Q.get('tab')||'upcoming');
document.body.insertAdjacentHTML('beforeend',DLG('dlgBook','Book for a client',FLD('bkC','Client',SELECT('bkC',['Tomás Duarte','Grace Okafor','New person…']))+FLD('bkS','Time',SELECT('bkS',['Tue 20 Oct 11:00 ET','Thu 22 Oct 13:30 ET']),'Only free slots with buffer are shown')+FLD('bkA','Agreement',SELECT('bkA',['Send consultation agreement C-02 v3','Already signed'])),`<button class="btn" onclick="closeDlg('dlgBook')">Cancel</button><button class="btn p" onclick="closeDlg('dlgBook');toast2('Consultation booked',{kind:'ok',sub:'The slot is held. Agreement sent.'})">Book</button>`)+
 DLG('dlgRes','Reschedule Ana’s consultation',FLD('rsS','New time',SELECT('rsS',['Tue 27 Oct 10:30 ET','Thu 29 Oct 14:00 ET']))+`<p class="fp-note">Ana gets an email and a portal update. Her reminders move with it.</p>`,`<button class="btn" onclick="closeDlg('dlgRes')">Cancel</button><button class="btn p" onclick="closeDlg('dlgRes');toast2('Rescheduled',{kind:'ok'})">Reschedule</button>`)+
 DLG('dlgVoid','Void this agreement?',`<p>Tomás’s signing link stops working straight away. The agreement stays on record as voided, and you can send a new one later.</p>`+FLD('vdR','Reason (staff only)',`<textarea class="inp" id="vdR" rows="3" maxlength="300" placeholder="e.g. Wrong template sent"></textarea>`,'Shown on the record with who voided it and when'),`<button class="btn" onclick="closeDlg('dlgVoid')">Keep it</button><button class="btn p" style="background:#a12c20" onclick="closeDlg('dlgVoid');AG='voided';tab('record');toast2('Agreement voided')">Void agreement</button>`)+
 DLG('dlgCan','Cancel this consultation?',`<p>Hamid Rahimi is told by email and in his portal. No fee was paid, so there’s nothing to refund.</p>`,`<button class="btn" onclick="closeDlg('dlgCan')">Keep it</button><button class="btn p" style="background:#a12c20" onclick="closeDlg('dlgCan');toast2('Consultation cancelled')">Cancel consultation</button>`));

</script></body></html>
