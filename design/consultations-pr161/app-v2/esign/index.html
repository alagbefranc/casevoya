<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Sign: Employer declaration · Northline Immigration · Casevoya</title>
<link rel="stylesheet" href="../kit/base.css"><link rel="stylesheet" href="../kit/mascot.css"><link rel="stylesheet" href="../kit/kit2.css"><link rel="stylesheet" href="../kit/aft.css"><style>
body.es{background:var(--canvas);min-height:100vh;display:flex;flex-direction:column}
.es-top{display:flex;align-items:center;gap:14px;padding:14px clamp(16px,4vw,40px);background:#fff;border-bottom:1px solid var(--line)}
.es-top img{height:28px;width:auto}.es-top .sec{margin-left:auto;display:inline-flex;gap:8px;align-items:center;font-size:13.5px;color:#063f6e;background:var(--tint);padding:6px 12px;border-radius:999px}
.es-main{flex:1;width:100%;max-width:760px;margin:0 auto;padding:clamp(20px,5vw,48px) clamp(16px,4vw,24px) 120px}
.es-main.wide{max-width:1180px}
.es-card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:clamp(20px,4vw,32px)}
.es h1{font:300 clamp(30px,4.2vw,44px)/1.08 Erode,serif;letter-spacing:-.015em;margin:0 0 10px;color:var(--ink)}
.es .lead{font-size:16px;color:var(--t2);max-width:58ch;margin:0 0 20px}
.es-doc{display:flex;gap:16px;align-items:center;padding:14px 16px;border-radius:14px;background:var(--canvas);margin:0 0 20px}
.es-doc img{width:56px;height:75px;border-radius:6px;border:1px solid var(--line);object-fit:cover;flex:none}
.es-doc b{font-weight:500;display:block}.es-doc small{color:var(--t2);font-size:13.5px}
.es-steps{list-style:none;margin:0 0 22px;padding:0;display:grid;gap:10px;counter-reset:s}
.es-steps li{counter-increment:s;display:grid;grid-template-columns:28px 1fr;gap:12px;font-size:15px;align-items:start}
.es-steps li::before{content:counter(s);width:26px;height:26px;border-radius:50%;background:var(--tint);color:#075b9f;display:grid;place-items:center;font-size:13px}
.es-act{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.es-act .btn{height:46px;padding:0 20px;font-size:15.5px}
.es-link{background:none;border:0;padding:0;font:inherit;font-size:14px;color:var(--t2);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.es-foot{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;justify-content:center;padding:18px;font-size:13px;color:var(--t2);border-top:1px solid var(--line);background:#fff}
.es-foot a{color:var(--t2)}.es-foot img{height:16px;width:auto;vertical-align:-3px}
.es-meta{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:14px;margin:0 0 20px}.es-meta dt{color:var(--t2)}.es-meta dd{margin:0}
.es-rev{display:grid;grid-template-columns:120px minmax(0,1fr) 300px;gap:20px;align-items:start}
.es-thumbs{display:grid;gap:12px;position:sticky;top:20px}
.es-thumbs button{display:grid;gap:6px;padding:6px;border-radius:10px;border:1px solid transparent;background:none;cursor:pointer;font:inherit;font-size:12.5px;color:var(--t2);text-align:center}
.es-thumbs button[aria-current="true"]{border-color:var(--blue);background:#fff;color:var(--ink)}
.es-thumbs .pg{aspect-ratio:3/4;border-radius:6px;border:1px solid var(--line);background:#fff;overflow:hidden;position:relative}
.es-thumbs .pg img{width:100%;height:100%;object-fit:cover;display:block}
.es-thumbs .pg .dot{position:absolute;right:6px;bottom:6px;width:10px;height:10px;border-radius:50%;background:var(--blue);box-shadow:0 0 0 3px #fff}
.es-pages{display:grid;gap:18px}
.es-page{background:#fff;border:1px solid var(--line);border-radius:10px;aspect-ratio:3/4;overflow:hidden;position:relative}
.es-page>img{width:100%;height:100%;object-fit:cover;display:block}
.es-p2{padding:8% 9%;font-size:clamp(11px,1.25vw,15px);line-height:1.55;color:#2b2926;display:flex;flex-direction:column;gap:1em}
.es-p2 h3{font:400 1.25em Erode,serif;margin:0}.es-p2 .ln{border-bottom:1px solid #c9c5c0;height:3.2em;display:flex;align-items:flex-end}
.es-field{display:flex;align-items:center;gap:8px;width:100%;height:3.4em;border-radius:8px;border:1.5px dashed var(--blue);background:#eef6fe;color:#075b9f;font:inherit;padding:0 .9em;cursor:pointer;transition:background 160ms ease-out}
.es-field:hover{background:#e1effd}.es-field.done{border-style:solid;background:#fff;color:#0a3d78;font:italic 300 1.9em Erode,serif;cursor:default}
.es-field.done img{max-height:2.6em}
.es-side{display:grid;gap:14px;position:sticky;top:20px}
.es-side .es-card{padding:18px}.es-side h2{font-size:16px;font-weight:500;margin:0 0 10px}
.es-fl{list-style:none;margin:0;padding:0;display:grid;gap:8px;font-size:14px}.es-fl li{display:flex;gap:8px;align-items:center}.es-fl .ic{color:var(--blue)}
.es-bar{display:none}
.es-tabs{margin:0 0 14px}
.es-up{display:grid;place-items:center;gap:6px;height:150px;border:1.5px dashed #c9c5c0;border-radius:12px;background:#fff;color:var(--t2);font-size:14px;text-align:center;cursor:pointer}
.es-done{text-align:center;display:grid;justify-items:center;gap:6px}
.es-done .es-act{justify-content:center;margin-top:12px}
.es-sw{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:22px 0 0;font-size:12.5px}
.es-sw a{padding:4px 10px;border-radius:999px;background:#fff;box-shadow:inset 0 0 0 1px #e6e3df;color:#3b3935;text-decoration:none}.es-sw a[aria-current]{background:#111;color:#fff;box-shadow:none}
.es-otp{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;max-width:360px;margin:6px 0 8px}
.es-otp input{height:58px;width:100%;text-align:center;font:400 26px Erode,serif;border-radius:10px;border:1px solid #d6d2cd;background:#fff;color:var(--ink)}
.es-otp input:focus{outline:0;border-color:var(--blue);box-shadow:0 0 0 3px rgba(0,117,222,.18)}
.es-otp.bad input{border-color:var(--bad);background:#fffaf9}
.es-msg{font-size:14px;min-height:20px}.es-msg.bad{color:var(--bad)}
@media (max-width:1000px){.es-rev{grid-template-columns:1fr}.es-thumbs{position:static;grid-auto-flow:column;grid-auto-columns:84px;justify-content:start;overflow-x:auto}.es-side{position:static}}
@media (max-width:640px){.es-top{padding:12px 16px}.es-top img{height:22px}.es-top .sec span{display:none}.es-top .sec{padding:6px 9px}
 .es-act .btn{flex:1 1 100%}.es-meta{grid-template-columns:1fr;gap:2px}.es-meta dd{margin-bottom:8px}
 .es-bar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:20;gap:10px;align-items:center;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--line)}
 .es-bar .btn{flex:1;height:48px}.es-bar small{font-size:13px;color:var(--t2);flex:none}
 .es-side .es-act{display:none}.es-foot{padding-bottom:90px}}
@media (prefers-reduced-motion:reduce){.es-field{transition:none}}
</style></head>
<body class="es">
<script src="../kit/icons-open.js"></script><a class="sr" href="#main">Skip to content</a>
<header class="es-top"><img src="../../assets/firms/northline-lockup.svg" alt="Northline Immigration" width="180" height="28"><span class="sec"><svg class="ic s" aria-hidden="true"><use href="#i-lock"/></svg><span>Signing secured by Casevoya</span></span></header>
<main class="es-main" id="main"></main>
<footer class="es-foot"><span><img src="../../assets/brand/casevoya-wordmark.svg" alt="Casevoya" width="100" height="16"> Signing secured by Casevoya</span><span>Every step is recorded with the time and the document’s fingerprint.</span><a href="#">Privacy</a><a href="#">Help</a></footer>
<script>window.CV_BASE='../../';</script><script src="../kit/ui.js"></script><script src="../kit/mascot.js"></script><script src="../kit/kit2.js"></script><script src="../kit/rb.js"></script><script src="../kit/aft.js"></script>
<script>
const q=new URLSearchParams(location.search);let ST=q.get('state')||'landing';
const DOC='Employer declaration for Rafael Sharma',ME='Dana Okonkwo-Hale',MAIL='d.ok•••@mapleandfinch.example';
let SIG=null;
const thumb=`<img src="${CV_BASE}assets/docs/employment-letter-600.webp" alt="" width="56" height="75">`;
const docRow=`<div class="es-doc">${thumb}<div><b>${DOC}</b><small>2 pages · from Northline Immigration · sent by Daniel Ruiz, 17 Oct 2026</small></div></div>`;
const SW=[['landing','Email link'],['verify','Check it’s you'],['verify-error','Wrong code'],['review','Review'],['sign','Signature'],['confirm','Confirm'],['done','Done'],['declined','Declined'],['expired','Expired link'],['signed','Already signed'],['error','Error'],['loading','Loading']];
const sw=()=>`<nav class="es-sw" aria-label="Preview a state (demo)">${SW.map(([k,t])=>`<a href="?state=${k}"${k==ST?' aria-current="true"':''}>${t}</a>`).join('')}</nav>`;
const card=(h)=>`<div class="es-card">${h}</div>`;
const V={
landing:()=>card(`<p class="lbl" style="margin:0 0 8px">Hello ${ME.split(' ')[0]}</p><h1>Northline Immigration asked you to sign a document</h1><p class="lead">Daniel Ruiz at Northline needs your signature as Rafael Sharma’s employer, for his family sponsorship file. It takes about two minutes. You don’t need an account.</p>${docRow}<ol class="es-steps"><li>Confirm it’s you with a code we email to ${MAIL}</li><li>Read both pages</li><li>Sign by typing, drawing or uploading your signature</li></ol><div class="es-act"><button class="btn p" data-go="verify">Review and sign</button><button class="es-link" data-dlg-open="dDecl">Decline to sign</button></div><p class="fp-note" style="margin-top:18px">This link is just for you and works until <b style="font-weight:500">24 Oct 2026</b>. Not ${ME}? <button class="es-link" onclick="toast2('Northline has been told',{sub:'They’ll check who this should go to. Nothing was signed.'})">Tell Northline</button></p>`),
verify:(bad)=>card(`<h1>Check it’s you</h1><p class="lead">We emailed a 6-digit code to <b style="font-weight:500">${MAIL}</b>. It works for 10 minutes (Policy: confirm).</p><label class="sr" for="o0">Six-digit code</label><div class="es-otp${bad?' bad':''}" id="otp">${[0,1,2,3,4,5].map(i=>`<input id="o${i}" inputmode="numeric" maxlength="1" autocomplete="${i?'off':'one-time-code'}" aria-label="Digit ${i+1} of 6"${bad?` value="${'482913'[i]}"`:''}>`).join('')}</div><p class="es-msg${bad?' bad':''}" id="om" role="status" aria-live="polite">${bad?'That code doesn’t match. Check the latest email; 2 tries left.':''}</p><div class="es-act" style="margin-top:8px"><button class="btn p" id="vGo"><span class="lab">Continue</span><span class="spin" aria-hidden="true"></span></button><button class="es-link" id="rs" disabled>Resend code in <span id="rsn">30</span>s</button></div><p class="fp-note" style="margin-top:18px">Can’t get the email? Check spam, or <button class="es-link" onclick="toast2('Request sent to Northline',{sub:'Daniel will confirm your email address and send a new link.'})">ask Northline to check your address</button>.</p>`),
review:()=>`<div class="es-rev"><nav class="es-thumbs" aria-label="Pages">${[1,2].map(n=>`<button type="button" data-pg="${n}"${n==1?' aria-current="true"':''}><span class="pg">${n==1?`<img src="${CV_BASE}assets/docs/employment-letter-600.webp" alt="">`:`<span class="es-p2" style="font-size:5px;padding:12%"><span class="ln"></span><span class="ln"></span></span><span class="dot" title="Signature needed"></span>`}</span>Page ${n}${n==2?' · sign':''}</button>`).join('')}</nav>
 <div class="es-pages"><h1 style="margin:0">${DOC}</h1><p class="lead" style="margin:-4px 0 4px">Read both pages. Your signature goes on page 2.</p><figure class="es-page" id="pg1" style="margin:0"><img src="${CV_BASE}assets/docs/employment-letter-1200.webp" alt="Page 1: Maple &amp; Finch Logistics letter confirming Rafael Sharma’s full-time employment as Operations Manager since 4 April 2017. Fictional, marked SPECIMEN." width="1200" height="1600"></figure>
 <section class="es-page es-p2" id="pg2" aria-label="Page 2 of 2"><h3>Declaration by the employer</h3><p>I confirm that the information on page 1 about Rafael Sharma’s employment with Maple &amp; Finch Logistics Ltd. (fictional) is true and complete, to the best of my knowledge.</p><p>I understand Northline Immigration will include this letter in an application to Immigration, Refugees and Citizenship Canada.</p><div><small style="color:var(--t2)">Signature of employer representative</small>${SIG?`<div class="es-field done">${SIG}</div>`:`<button type="button" class="es-field" data-go="sign">${I('signature','s')}Sign here · required</button>`}</div><div class="kv"><span>Name</span><b>${ME}</b><span>Title</span><b>HR Business Partner</b><span>Date</span><b>${SIG?'17 Oct 2026':'Filled in when you sign'}</b></div><p style="margin-top:auto;font-size:.85em;color:var(--t2)">SPECIMEN · fictional document for demonstration</p></section></div>
 <aside class="es-side"><div class="es-card"><h2>To do</h2><ul class="es-fl"><li>${I(SIG?'check-circle':'signature','s')}Your signature · page 2</li><li>${I('check-circle','s')}Date · filled in for you</li></ul></div><div class="es-card"><h2>About this document</h2><dl class="es-meta" style="margin:0"><dt>From</dt><dd>Northline Immigration · Daniel Ruiz</dd><dt>Signers</dt><dd>1. You · 2. Amara Osei, RCIC</dd><dt>Fingerprint</dt><dd class="num">SHA-256 9f3b…41aa</dd></dl></div><div class="es-act"><button class="btn p" data-go="${SIG?'confirm':'sign'}" style="width:100%">${SIG?'Continue':'Sign page 2'}</button><button class="es-link" data-dlg-open="dDecl">Decline to sign</button></div></aside></div>
 <div class="es-bar"><small>${SIG?'Ready':'1 field left'}</small><button class="btn p" data-go="${SIG?'confirm':'sign'}">${SIG?'Continue':'Sign page 2'}</button></div>`,
sign:()=>card(`<h1>Add your signature</h1><p class="lead">Choose how you’d like to sign. It goes on page 2 of “${DOC}”.</p><div class="es-tabs">${k2Seg(['Type','Draw','Upload'],0,'How to sign')}</div><div id="sp"></div><label class="check" style="margin:16px 0"><input type="checkbox" id="ok"><span>I agree to sign electronically. My electronic signature has the same effect as signing on paper.</span></label><div class="es-act"><button class="btn p" id="adopt">Use this signature</button><button class="btn" data-go="review">Back to the document</button></div>`),
confirm:()=>card(`<h1>Sign the document?</h1><p class="lead">You’re signing “${DOC}” as ${ME}, HR Business Partner. After this you can’t change it; Northline would need to send a new version.</p><div class="es-field done" style="font-size:16px;margin:0 0 18px;height:auto;min-height:84px;padding:12px 18px">${SIG||`<span style="font:italic 300 34px Erode,serif">${ME}</span>`}</div><dl class="es-meta"><dt>Date</dt><dd>17 Oct 2026, 11:52 ET</dd><dt>Recorded</dt><dd>Time, your email, the code check and the document fingerprint</dd><dt>Next</dt><dd>Amara Osei countersigns for Northline</dd></dl><div class="es-act"><button class="btn p" id="doSign"><span class="lab">${I('signature','s')} Sign now</span><span class="spin" aria-hidden="true"></span></button><button class="btn" data-go="sign">Change signature</button></div>`),
done:()=>card(`<div class="es-done">${voPose('cheer',88)}<h1>Signed. Thank you, ${ME.split(' ')[0]}.</h1><p class="lead" style="margin:0 auto">We emailed you a copy. Once Amara Osei countersigns, you’ll get the final copy with its completion certificate.</p><div class="es-act"><button class="btn p" data-doc="esign-certificate" data-doc-t="Signed copy and completion certificate">${I('download','s')}Download your copy</button></div><p class="fp-note" style="margin:14px auto 0">You can download it from this link until 24 Oct. After that, ask Northline for a copy.</p></div>`),
declined:()=>card(`<div class="es-done">${voPose('wave',80)}<h1>You declined to sign</h1><p class="lead" style="margin:0 auto">We told Daniel Ruiz at Northline, with your reason: “The salary on page 1 is out of date.” Nothing was signed.</p><p class="fp-note" style="margin:6px auto 0">Changed your mind? Northline can send you a corrected version.</p><div class="es-act"><button class="btn" onclick="toast2('Message sent to Northline',{sub:'Daniel will reply by email.'})">${I('mail','s')}Message Northline</button></div></div>`),
expired:()=>card(`<div class="es-done">${voPose('sleep',80)}<h1>This signing link has expired</h1><p class="lead" style="margin:0 auto">It was sent on 3 Oct and worked for 7 days (Policy: confirm). For your security, old links stop working. Nothing was signed.</p><div class="es-act"><button class="btn p" id="ask"><span class="lab">Ask for a new link</span><span class="spin" aria-hidden="true"></span></button></div><p class="fp-note" style="margin:10px auto 0">Northline Immigration · 100 Front St W, Toronto (fictional) · daniel@northline.example</p></div>`),
signed:()=>card(`<div class="es-done">${I('check-circle')}<h1>You’ve already signed this</h1><p class="lead" style="margin:0 auto">You signed “${DOC}” on 16 Oct 2026 at 14:03 ET. There’s nothing more to do.</p><div class="es-act"><button class="btn p" data-doc="esign-certificate" data-doc-t="Signed copy and completion certificate">${I('download','s')}Download your copy</button></div></div>`),
error:()=>card(`<div class="alert bad" role="alert" style="margin:0 0 16px">${I('alert')}<div><b>We couldn’t open this document</b>The server didn’t answer (request req_8c81). Nothing was signed and your link still works.</div></div><div class="es-act"><button class="btn p" id="rt"><span class="lab">${I('refresh','s')} Try again</span><span class="spin" aria-hidden="true"></span></button></div>`),
loading:()=>card(`<div role="status" aria-live="polite" aria-busy="true"><span class="sr">Opening the document…</span><div class="sk" style="height:34px;width:70%;margin:0 0 14px"></div><div class="sk" style="width:90%"></div><div class="sk" style="width:60%;margin:10px 0 22px"></div><div class="sk" style="height:96px;border-radius:14px"></div></div>`)};
function go(s){ST=s;const u=new URL(location);u.searchParams.set('state',s);history.replaceState(null,'',u);render();scrollTo(0,0);const h=document.querySelector('.es-main h1');if(h){h.tabIndex=-1;h.focus({preventScroll:true})}}
function render(){const m=$('#main');m.classList.toggle('wide',ST=='review');m.innerHTML=(ST=='verify-error'?V.verify(1):(V[ST]||V.landing)())+sw();bind()}
function bind(){document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));document.querySelectorAll('[data-dlg-open]').forEach(b=>b.onclick=()=>openDlg(b.dataset.dlgOpen,b));
 const o=[...document.querySelectorAll('#otp input')];o.forEach((x,i)=>{x.oninput=()=>{x.value=x.value.replace(/\D/g,'').slice(-1);if(x.value&&o[i+1])o[i+1].focus();$('#otp').classList.remove('bad');$('#om').className='es-msg';$('#om').textContent=''};x.onkeydown=e=>{if(e.key=='Backspace'&&!x.value&&o[i-1])o[i-1].focus()}});
 if($('#vGo')){$('#vGo').onclick=()=>{const v=o.map(x=>x.value).join('');if(v.length<6){$('#om').className='es-msg bad';$('#om').textContent='Enter all 6 digits.';o.find(x=>!x.value)?.focus();return}runBtn($('#vGo'),'ok',900);setTimeout(()=>go('review'),1000)};let n=30;const t=setInterval(()=>{n--;const e=$('#rsn');if(!e){clearInterval(t);return}e.textContent=n;if(n<=0){clearInterval(t);$('#rs').disabled=false;$('#rs').textContent='Resend code';$('#rs').onclick=()=>toast2('New code sent',{kind:'ok',sub:'The old one stops working.'})}},1000);if(ST=='verify')o[0].focus()}
 document.querySelectorAll('[data-pg]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-pg]').forEach(x=>x.setAttribute('aria-current',x==b));document.getElementById('pg'+b.dataset.pg).scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'})});
 if($('#sp')){const P=[()=>`<div class="fld"><label for="tn">Your name</label><input class="inp" id="tn" value="${ME}" autocomplete="name"></div><div class="ax-typed" id="tp" aria-live="polite">${ME}</div>`,()=>`<div class="ax-sig"><canvas id="cv" aria-label="Draw your signature with a mouse, finger or stylus" role="img"></canvas><span class="x">×</span></div><div class="es-act" style="margin-top:8px"><button class="es-link" id="clr">Clear</button><span class="fp-note" style="margin:0" id="inkm">Draw inside the box</span></div>`,()=>`<label class="es-up" for="upf">${I('upload')}<span><b style="font-weight:500;color:var(--ink)">Upload a picture of your signature</b><br>PNG or JPG, on a plain background</span></label><input type="file" id="upf" accept="image/png,image/jpeg" class="sr">`];let mode=0,pad=null;
  const show=i=>{mode=i;$('#sp').innerHTML=P[i]();if(i==0){$('#tn').oninput=e=>$('#tp').textContent=e.target.value||' '}if(i==1){pad=axSig($('#cv'),ink=>$('#inkm').textContent=ink?'Looks good':'Draw inside the box');$('#clr').onclick=()=>pad.clear()}if(i==2){$('#upf').onchange=e=>{if(e.target.files[0])toast2('Signature image added',{kind:'ok',sub:e.target.files[0].name})}}};
  show(0);k2Rubber(document.querySelector('.k2-rsw'),{onChange:i=>show(i)});
  $('#adopt').onclick=()=>{if(!$('#ok').checked){toast2('Tick the agreement first',{kind:'bad',sub:'It confirms you’re choosing to sign electronically.'});$('#ok').focus();return}
   if(mode==0)SIG=`<span style="font:italic 300 34px Erode,serif">${($('#tn').value||ME).replace(/</g,'')}</span>`;else if(mode==1){if(!pad.inked){toast2('Draw your signature first',{kind:'bad'});return}SIG=`<img src="${$('#cv').toDataURL()}" alt="Your drawn signature">`}else{SIG=`<span style="font:italic 300 34px Erode,serif">${ME}</span>`}go('confirm')}}
 if($('#doSign'))$('#doSign').onclick=()=>{runBtn($('#doSign'),'ok',1100);setTimeout(()=>go('done'),1200)};
 if($('#ask'))$('#ask').onclick=()=>{runBtn($('#ask'),'ok',1000);setTimeout(()=>toast2('Request sent to Northline',{kind:'ok',sub:'Daniel Ruiz will email you a new link.'}),1050)};
 if($('#rt'))$('#rt').onclick=()=>{runBtn($('#rt'),'fail',1000);setTimeout(()=>toast2('Still not loading',{kind:'bad',sub:'Try again in a minute. Your link still works.'}),1050)}}
document.body.insertAdjacentHTML('beforeend',`<dialog class="dlg" id="dDecl" aria-labelledby="dDeclH"><div class="dh"><h2 id="dDeclH">Decline to sign?</h2><button class="x" aria-label="Close" onclick="closeDlg('dDecl')">${I('close','s')}</button></div><div class="db"><p style="margin:0 0 12px">Northline will be told you declined, with your reason. The document won’t be signed by anyone.</p><div class="fld"><label for="dr">Reason (Northline sees this)</label><textarea class="ta" id="dr">The salary on page 1 is out of date.</textarea></div></div><div class="df"><button class="btn" onclick="closeDlg('dDecl')">Keep reviewing</button><button class="btn p" id="dGo">Decline</button></div></dialog>`);
